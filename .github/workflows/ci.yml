name: ci
on:
  push:
  pull_request:
jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test
        run: forge test -q
      - name: Coverage
        run: forge coverage --ir-minimum --report summary
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: .
          slither-args: --filter-paths lib
